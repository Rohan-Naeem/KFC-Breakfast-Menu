<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Sunny Skillet mascot — original chef illustration for KFC Breakfast Menu USA</title>
  <circle cx="60" cy="60" r="58" fill="#E4002B"/>
  <circle cx="60" cy="60" r="58" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- chef hat -->
  <path d="M35 44c0-11 9-19 19-19 3 0 6 1 8 2 3-6 9-9 15-8 8 1 13 8 12 16 6 1 10 6 10 12 0 2 0 3-1 5H36c-1-2-1-4-1-8z" fill="#F7F4F0" stroke="#111111" stroke-width="2.5"/>
  <rect x="34" y="49" width="52" height="9" rx="3" fill="#F7F4F0" stroke="#111111" stroke-width="2.5"/>

  <!-- face -->
  <ellipse cx="60" cy="76" rx="24" ry="22" fill="#F2C29B" stroke="#111111" stroke-width="2.5"/>

  <!-- ears -->
  <circle cx="37" cy="78" r="5" fill="#F2C29B" stroke="#111111" stroke-width="2"/>
  <circle cx="83" cy="78" r="5" fill="#F2C29B" stroke="#111111" stroke-width="2"/>

  <!-- eyes -->
  <circle cx="51" cy="73" r="2.6" fill="#111111"/>
  <circle cx="69" cy="73" r="2.6" fill="#111111"/>

  <!-- rosy cheeks -->
  <circle cx="45" cy="82" r="3.4" fill="#E4002B" opacity="0.35"/>
  <circle cx="75" cy="82" r="3.4" fill="#E4002B" opacity="0.35"/>

  <!-- smile -->
  <path d="M50 84c3 4 7 6 10 6s7-2 10-6" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>

  <!-- curly mustache, original shape -->
  <path d="M44 79c3-3 7-4 10-2 2-3 6-3 8 0 3-2 7-1 10 2-3-1-6 0-8 2-2-2-5-2-6 0-1-2-4-2-6 0-2-2-5-3-8-2z" fill="#5b3a29" stroke="#111111" stroke-width="1.5"/>

  <!-- bandana / neckerchief -->
  <path d="M40 96c6 5 14 8 20 8s14-3 20-8l-4 10c-5 3-11 5-16 5s-11-2-16-5z" fill="#111111"/>
</svg>
